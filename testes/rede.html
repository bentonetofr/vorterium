<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teste de rede do Vortable</title>
    <style>
      body { margin: 0; background: #0f121a; color: #eef1f7; font: 14px/1.4 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 420px 1fr; gap: 12px; padding: 12px; }
      h1 { margin: 0 0 6px; font-size: 18px; }
      canvas { width: 400px; height: 300px; background: #171c28; border: 1px solid #3a4157; border-radius: 8px; }
      button { margin: 2px; padding: 4px 10px; border: 1px solid #3a4157; border-radius: 6px; background: #222a3d; color: inherit; cursor: pointer; }
      #log { height: 420px; overflow: auto; margin: 0; padding: 8px; background: #0a0d14; border-radius: 8px; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; }
      #status { font-weight: 700; }
      table { border-collapse: collapse; font-size: 13px; }
      td, th { padding: 2px 8px; border-bottom: 1px solid #2a3042; text-align: left; }
      .ok { color: #7ee787; } .bad { color: #ff7b72; } .warn { color: #e9b44c; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1 id="title">Teste de rede</h1>
        <div id="status">…</div>
        <canvas id="map" width="400" height="300"></canvas>
        <div id="buttons"></div>
        <div id="peers"></div>
      </section>
      <pre id="log"></pre>
    </main>
    <div id="pops"></div>
    <script type="module" src="./rede.ts"></script>
  </body>
</html>
